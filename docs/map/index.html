<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harta - Gunoi Arad</title>
  <link rel="stylesheet" href="../static/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="../static/map.js"></script>
  <script>window.GUNOI_STATIC = true;</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" aria-label="Gunoi Arad">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Gunoi <strong>Arad</strong></span>
    </a>
    <nav class="topnav" aria-label="Navigare">
      <a href="../">Program</a>
      <a href="../map/">Harta</a>
      <a href="../ghid/">Ghid</a>
      <a href="../manifesto/">Manifest</a>
      <a href="https://www.openstreetmap.org/#map=12/46.1866/21.3123" target="_blank" rel="noreferrer">OpenStreetMap</a>
    </nav>
  </header>
  <main class="map-page">
    <section class="map-copy">
      <a class="back-link" href="../">Inapoi la program</a>
      <h1>Harta interactiva</h1>
      <p>Cauta strada ta din Arad si vezi programul. Harta foloseste geocodare automata de la OpenStreetMap pentru a gasi strada.</p>
    </section>
    <section class="map-layout">
      <div class="map-frame" id="map"></div>
      <aside class="map-panel">
        <label for="map-neighborhood">Cartier</label>
        <select id="map-neighborhood">
          <option value="">Alege un cartier</option>
        </select>
        <label for="map-street">Strada</label>
        <input id="map-street" placeholder="Cauta strada">
        <div id="map-results" class="map-results"></div>
      </aside>
    </section>
  </main>
</body>
</html>
