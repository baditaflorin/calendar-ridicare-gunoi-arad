services:
  app:
    image: ${GUNOI_IMAGE:-ghcr.io/baditaflorin/calendar-ridicare-gunoi-arad:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GUNOI_HTTP_ADDR: :8080
      GUNOI_PUBLIC_BASE_URL: ${GUNOI_PUBLIC_BASE_URL:-http://localhost:26453}
      GUNOI_DB_PATH: /data/db/gunoiarad.db
      GUNOI_RAW_DIR: /data/raw
      GUNOI_REFRESH_INTERVAL: ${GUNOI_REFRESH_INTERVAL:-6h}
      GUNOI_BOOTSTRAP_ETL: "true"
      TZ: Europe/Bucharest
    volumes:
      - gunoi_data:/data
    expose:
      - "8080"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "26453:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  gunoi_data:
